name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project zip if present
        run: |
          ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YAHIA-Salli-Ala-AlHabib-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
